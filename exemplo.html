<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pontos em movimento: 3.000 lojas fictícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pontos.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--pm-fundo); color: var(--pm-texto); }
  body { overflow: hidden; font-family: var(--pm-fonte); }
  .app {
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 12px;
    height: 100dvh;
    max-width: 1440px;
    margin: 0 auto;
    padding: 16px clamp(12px, 2.4vw, 32px) 12px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
  header h1 { margin: 0; font: 600 clamp(15px, 1.6vw, 19px)/1.2 var(--pm-fonte-titulo); text-wrap: balance; min-width: 0; }
  header h1 small { display: block; font: 400 12px/1.4 var(--pm-fonte); color: var(--pm-texto2); }
  .marca { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pm-acento); margin-right: 8px; box-shadow: 0 0 0 4px rgba(34, 211, 238, .15); vertical-align: middle; }
  footer { font-size: 11px; line-height: 1.5; color: var(--pm-texto2); min-width: 0; overflow-wrap: anywhere; }
  #palco { min-height: 0; min-width: 0; }
  @media (max-width: 520px) { .app { padding-top: 10px; gap: 8px; } footer { font-size: 10px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="marca"></span>Pontos em movimento <small>3.000 lojas fictícias, seis jeitos de olhar</small></h1>
    <button class="pm-btn" id="tema" type="button" aria-label="Trocar tema claro ou escuro" title="Trocar tema">Tema</button>
  </header>
  <div id="palco"></div>
  <footer>
    <div>Fonte: dados fictícios gerados no próprio navegador (semente fixa, sempre os mesmos números)</div>
    <div>Janela: um mês inventado, sem relação com nenhuma empresa real</div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="pontos.js"></script>
<script>
// ---------- dado fictício: 3.000 lojas num país inventado ----------
function rng(s) { return function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const r = rng(2026);
const normal = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
// contorno do país: um círculo deformado
const borda = (a) => 1 + 0.22 * Math.sin(3 * a + 0.4) + 0.12 * Math.cos(5 * a + 1.1) + 0.06 * Math.sin(9 * a);
const dentro = (x, y) => Math.hypot(x, y) < 0.95 * borda(Math.atan2(y, x));
// cidades-polo onde as lojas se concentram
const polos = Array.from({ length: 14 }, () => { let x, y; do { x = (r() - .5) * 1.8; y = (r() - .5) * 1.8; } while (!dentro(x, y)); return { x, y, peso: .3 + r() }; });
const somaPeso = polos.reduce((s, p) => s + p.peso, 0);
function regiao(x, y) {
  if (Math.hypot(x, y) < 0.36) return "Centro";
  const a = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  if (a >= 45 && a < 135) return "Norte";
  if (a >= 135 && a < 225) return "Oeste";
  if (a >= 225 && a < 315) return "Sul";
  return "Leste";
}
const bonusRegiao = { Norte: -6, Leste: 4, Sul: 8, Oeste: -2, Centro: 2 };
const lojas = [];
while (lojas.length < 3000) {
  let x, y;
  if (r() < 0.78) { // perto de um polo
    let alvo = r() * somaPeso, p = polos[0];
    for (const q of polos) { alvo -= q.peso; if (alvo <= 0) { p = q; break; } }
    x = p.x + normal() * 0.09; y = p.y + normal() * 0.09;
  } else { x = (r() - .5) * 2; y = (r() - .5) * 2; }
  if (!dentro(x, y)) continue;
  const reg = regiao(x, y);
  const faturamento = Math.round(Math.exp(4.4 + normal() * 0.75)); // R$ mil por mês
  const satisfacao = Math.round(Math.max(18, Math.min(99, 66 + bonusRegiao[reg] + normal() * 11)) * 10) / 10;
  const crescimento = Math.round(((satisfacao - 64) * 0.55 + normal() * 7) * 10) / 10;
  const i = lojas.length + 1;
  lojas.push({
    id: "L" + String(i).padStart(4, "0"), nome: "Loja " + String(i).padStart(4, "0"),
    valor: faturamento, x, y, regiao: reg, categoria: reg,
    porte: faturamento < 60 ? "Pequena" : faturamento <= 250 ? "Média" : "Grande",
    satisfacao, crescimento,
  });
}
const centroRegiao = (nome) => {
  const l = lojas.filter((d) => d.regiao === nome);
  return { x: d3.mean(l, (d) => d.x), y: d3.mean(l, (d) => d.y), texto: nome };
};
const moeda = (mil) => "R$ " + (mil >= 1000 ? (mil / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi" : mil.toLocaleString("pt-BR") + " mil");
const sinal = (v) => (v > 0 ? "+" : "") + v.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
const nota = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt = (n) => n.toLocaleString("pt-BR");

// ---------- cenas ----------
const regioes = ["Norte", "Leste", "Sul", "Oeste", "Centro"];
const cenas = [
  { tipo: "mapa", titulo: "Cada ponto é uma loja",
    texto: `São ${fmt(lojas.length)} lojas fictícias num país inventado. O tamanho do ponto é o faturamento do mês.`,
    rotulos: regioes.map(centroRegiao) },
  { tipo: "agrupar", por: "regiao", ordem: regioes, titulo: "As lojas saem do mapa e se juntam por região",
    texto: "O tamanho continua sendo o faturamento. Quanto maior a bola, mais dinheiro a região movimenta." },
  { tipo: "grade", por: "porte", ordem: ["Pequena", "Média", "Grande"], tamanho: "unidade",
    titulo: "Agora todas do mesmo tamanho, contadas por porte",
    texto: "Aqui cada ponto vale uma loja, seja qual for o faturamento. Pequena fatura até R$ 60 mil por mês e grande, acima de R$ 250 mil." },
  { tipo: "barras", por: "regiao", orientacao: "horizontal", tamanho: "unidade",
    titulo: "Quantas lojas tem cada região",
    texto: "Uma barra de pontos por região, da maior para a menor. A cor continua sendo a região." },
  { tipo: "eixo", x: { campo: "satisfacao", rotulo: "nota de satisfação (0 a 100)", dominio: [15, 100] },
    titulo: "A nota de satisfação dos clientes",
    texto: "Cada loja escorrega até a sua nota. Onde os pontos se empilham, há muitas lojas com nota parecida." },
  { tipo: "dispersao",
    x: { campo: "satisfacao", rotulo: "satisfação", dominio: [15, 100] },
    y: { campo: "crescimento", rotulo: "crescimento no ano", formato: (v) => sinal(v), referencia: 0 },
    rotulos: [{ x: 92, y: 26, texto: "cresceram", ancora: "end" }, { x: 22, y: -26, texto: "encolheram", ancora: "start" }],
    titulo: "Satisfação e crescimento andam juntos",
    texto: "Para a direita, clientes mais satisfeitos. Para cima, lojas que cresceram. Abaixo da linha tracejada ficam as que encolheram." },
];

const pm = Pontos.criar("#palco", {
  itens: lojas,
  cenas,
  cor: { campo: "regiao", ordem: regioes, cores: { Norte: "var(--pm-c1)", Leste: "var(--pm-c2)", Sul: "var(--pm-c3)", Oeste: "var(--pm-c4)", Centro: "var(--pm-c5)" } },
  dica: (d) => `<b>${d.nome}</b><br><span>região</span> ${d.regiao}<br><span>faturamento</span> ${moeda(d.valor)}<br><span>satisfação</span> ${nota(d.satisfacao)}<br><span>crescimento</span> ${sinal(d.crescimento)}`,
  renderizador: new URLSearchParams(location.search).get("render") || "auto",
});
window.pm = pm;

document.getElementById("tema").addEventListener("click", () => {
  const h = document.documentElement;
  h.dataset.tema = h.dataset.tema === "claro" ? "" : "claro";
  pm.tema();
});
</script>
</body>
</html>
